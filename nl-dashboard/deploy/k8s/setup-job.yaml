# One-off: data sources in Superset (sample Postgres and/or ClickHouse), datasets with metrics, starter dashboards
# (../../demo-data/setup/setup.mts, mounted from the nl-dashboard-setup ConfigMap; README). Not in kustomization.yaml:
#   kubectl -n lenspack apply -f nl-dashboard/deploy/k8s/setup-job.yaml
apiVersion: batch/v1
kind: Job
metadata: { name: nl-dashboard-setup, labels: { app.kubernetes.io/part-of: nl-dashboard } }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: ghcr.io/theflywheel/lenspack:719526e   # the same Lenspack image as kustomization.yaml
          command: [/app/node_modules/.bin/tsx, --tsconfig, /app/tsconfig.base.json, /setup/setup.mts]
          env:
            - { name: SUPERSET_URL, value: "http://nl-dashboard-superset:8088" }
            - { name: SUPERSET_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: nl-dashboard, key: SUPERSET_ADMIN_PASSWORD } } }
            # Each part runs only when its settings are in the Secret.
            - { name: DATA_SQLALCHEMY_URI, valueFrom: { secretKeyRef: { name: nl-dashboard, key: DATA_SQLALCHEMY_URI, optional: true } } }
            # ClickHouse in the same cluster: no tunnel, Superset connects to its Service directly.
            - { name: CLICKHOUSE_HOST, value: clickhouse }
            - { name: CLICKHOUSE_USER, valueFrom: { secretKeyRef: { name: nl-dashboard, key: CLICKHOUSE_USER, optional: true } } }
            - { name: CLICKHOUSE_PASSWORD, valueFrom: { secretKeyRef: { name: nl-dashboard, key: CLICKHOUSE_PASSWORD, optional: true } } }
            - { name: CLICKHOUSE_DATABASE, valueFrom: { secretKeyRef: { name: nl-dashboard, key: CLICKHOUSE_DATABASE, optional: true } } }
            - { name: CLICKHOUSE_TENANT, valueFrom: { secretKeyRef: { name: nl-dashboard, key: CLICKHOUSE_TENANT, optional: true } } }
          volumeMounts: [{ name: setup, mountPath: /setup, readOnly: true }]
      volumes:
        - name: setup
          configMap: { name: nl-dashboard-setup }
