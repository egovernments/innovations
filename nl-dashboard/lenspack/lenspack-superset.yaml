# Lenspack over Superset. Used as is by docker-compose.yml and by k8s/ (as a ConfigMap).
# A string "env:NAME" reads the environment variable NAME.
superset:
  url: env:SUPERSET_URL                 # how Lenspack reaches Superset's API (compose: http://superset:8088)
  username: lenspack                    # the service account superset/init.sh creates
  passwordEnv: LENSPACK_SUPERSET_PASSWORD
  # publicUrl: https://superset.example.org   # only when browsers reach Superset elsewhere than this host

# Browsers reach Lenspack under Superset's own host, at this path (compose: proxy/nginx.conf, k8s: the
# ingress). Same origin, so the overlay and the iframe need no CORS or CSP exceptions.
publicPath: /lenspack
host: 0.0.0.0
port: 8795

# Superset datasets that make the catalogue, by table name (made by setup/setup.mts).
datasets: [public.hcm_task, public.hcm_household, public.hcm_stock]
# Dashboards bound at start. Any other dashboard binds the first time someone opens the chat on it.
dashboards: []
state: /data/superset-boards.json
budget: { usdPerDay: 15, usdPerUserPerDay: 10 }

# What Superset does not say about the data: names, hierarchies, and guidance for the model.
overlay:
  pack: hcm_superset
  entities: { hcm_task: task, hcm_household: household, hcm_stock: stock }
  description: HCM campaign data in Superset (masked copy of the Nigeria SMC/MR-DN campaigns, May 2025 to April 2026).
  timeZone: UTC
  hierarchies:
    boundary: [state, lga, ward, health_facility, community]
  instructions: >-
    The data runs from March 2025 to April 2026, so relative windows like "last 30 days" are empty: use explicit dates
    (from/to) or no time range. Tasks, households and stock are separate datasets: a chart reads one of them, and a
    dimension is only usable with a measure from a dataset that has it (state and lga are on tasks and households,
    product is on tasks and stock). delivery_rate is a ratio: never add or average it across groups yourself.
    Layout: the board packs itself (gaps close, rows fill). Make layout changes in one batch and do not keep
    re-adjusting: four tiles in a row are quarter width each, three are third. Widgets kept as Superset's
    (text widgets describing a Superset chart) can be moved, resized or removed but not edited.
  examples:
    - question: Add a bar chart of doses delivered by LGA, top 10
      query: { kind: breakdown, dimension: lga, measure: doses_delivered, limit: 10 }
    - question: Show households registered per week as a line
      query: { kind: series, measure: household_count, grain: week }
    - question: Add the delivery rate by state as a table with tasks and referrals beside it
      query: { kind: breakdown, dimension: state, measure: delivery_rate, measures: [task_count, referred], limit: 10 }
    - question: Replace the pie with a bar chart of households by state
      query: { kind: breakdown, dimension: state, measure: household_count, limit: 10 }
