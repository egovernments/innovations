# Superset 5 + Lenspack on one machine. Everything is reached through the proxy:
#   http://<host>:8088/                       Superset (the "inside" overlay is on dashboard pages)
#   http://<host>:8088/lenspack/superset/<id>  the "beside" page (chat + Superset in an iframe)
# Variables: .env (copy .env.example). Steps: README.md.
name: nl-dashboard

x-superset-env: &superset-env
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set in .env}
  DB_HOST: db
  DB_PASSWORD: ${PG_PASSWORD:?set in .env}
  LENSPACK_URL: /lenspack
  TALISMAN_ENABLED: ${TALISMAN_ENABLED:-true}
  # The beside page's origin(s), space-separated: added to CSP frame-ancestors so it may frame Superset.
  LENSPACK_BESIDE_ORIGINS: ${LENSPACK_BESIDE_ORIGINS:-}
  # Link to the beside page shown on Settings → Manage → AI assistant.
  LENSPACK_BESIDE_URL: ${LENSPACK_BESIDE_URL:-}
  # Mapbox public (pk.) token for the basemap under deck.gl map charts; empty = no basemap.
  MAPBOX_API_KEY: ${MAPBOX_API_KEY:-}
  # Shared with lenspack: lets Settings → AI assistant change the chat and speech models. Empty = read-only.
  LENSPACK_SETTINGS_TOKEN: ${LENSPACK_SETTINGS_TOKEN:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set in .env}
      POSTGRES_DB: superset
    volumes:
      - pg:/var/lib/postgresql/data
      # Creates the "hcm" database for the sample data on first start.
      - ./sample-data/create-db.sql:/docker-entrypoint-initdb.d/01-hcm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  superset-init:
    image: nl-dashboard-superset:5.0.0
    build: ./superset
    command: ["/app/nl-dashboard-init.sh"]
    environment:
      <<: *superset-env
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set in .env}
      LENSPACK_SUPERSET_PASSWORD: ${LENSPACK_SUPERSET_PASSWORD:?set in .env}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  superset:
    image: nl-dashboard-superset:5.0.0
    environment:
      <<: *superset-env
      SERVER_WORKER_AMOUNT: "4"
    depends_on:
      superset-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  lenspack:
    image: nl-dashboard-lenspack:latest
    build: ./lenspack
    environment:
      SUPERSET_URL: http://superset:8088
      # Where browsers reach Superset: the beside page (another port) frames it from here.
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://127.0.0.1:8088}
      LENSPACK_SUPERSET_PASSWORD: ${LENSPACK_SUPERSET_PASSWORD:?set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LENSPACK_LLM_PROVIDERS: ${LENSPACK_LLM_PROVIDERS:-}
      # Same value as Superset's: only the AI assistant page may change runtime settings.
      LENSPACK_SETTINGS_TOKEN: ${LENSPACK_SETTINGS_TOKEN:-}
    volumes:
      # Which config: lenspack-superset.yaml (sample data) or lenspack-superset.clickhouse.yaml.
      - ./lenspack/${LENSPACK_CONFIG:-lenspack-superset.yaml}:/config/lenspack-superset.yaml:ro
      - lenspack:/data
    depends_on:
      superset: { condition: service_healthy }
    # Exits until the datasets exist (setup/setup.mts), then stays up.
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8088}:8088"
      # The "beside" page (chat + Superset in an iframe) on its own port.
      - "${BIND_ADDRESS:-127.0.0.1}:${BESIDE_PORT:-8795}:8795"
    depends_on: [superset]
    restart: unless-stopped

  # One-off: the HCM database in Superset, three datasets with metrics, and a starter dashboard.
  #   docker compose run --rm setup
  setup:
    image: nl-dashboard-lenspack:latest
    profiles: [setup]
    entrypoint: ["/app/node_modules/.bin/tsx", "--tsconfig", "/app/tsconfig.base.json", "/setup/setup.mts"]
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set in .env}
      DATA_SQLALCHEMY_URI: ${DATA_SQLALCHEMY_URI:-postgresql+psycopg2://superset:${PG_PASSWORD}@db:5432/hcm}
      # ClickHouse part, run when CLICKHOUSE_PASSWORD is set (pass it with -e; keep it out of .env if you can).
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse-tunnel}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-analytics}
      CLICKHOUSE_TENANT: ${CLICKHOUSE_TENANT:-ng}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - ./setup:/setup:ro
    depends_on:
      superset: { condition: service_healthy }

  # ClickHouse in a Kubernetes cluster, reached by port-forward (a read kubeconfig is enough).
  # Superset's ClickHouse database points at clickhouse-tunnel:8123.
  #   docker compose --profile clickhouse up -d clickhouse-tunnel
  # Skip it when ClickHouse is reachable directly: set CLICKHOUSE_HOST/CLICKHOUSE_PORT instead.
  clickhouse-tunnel:
    image: registry.k8s.io/kubectl:v1.35.0
    profiles: [clickhouse]
    user: "${UID:-1000}"
    command:
      - port-forward
      - --address=0.0.0.0
      - --context=${CLICKHOUSE_KUBE_CONTEXT:-}
      - --namespace=${CLICKHOUSE_KUBE_NAMESPACE:-clickhouse}
      - ${CLICKHOUSE_KUBE_SERVICE:-svc/clickhouse}
      - 8123:8123
    environment:
      KUBECONFIG: /kube/config
    volumes:
      # Defaults keep `docker compose` working when the clickhouse profile is not used.
      - ${CLICKHOUSE_KUBECONFIG:-/dev/null}:/kube/config:ro
    # port-forward exits when the connection drops; Docker starts it again.
    restart: unless-stopped

volumes:
  pg: {}
  lenspack: {}
