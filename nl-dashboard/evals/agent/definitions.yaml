# Definitions register for the Lenspack accuracy eval (Superset + eGov unified-dev ClickHouse).
#
# Every term below has more than one defensible reading in the data. For each one the register gives:
#   - the competing definitions, each with its SQL and its value on the synthetic ng field-test data,
#   - what the Lenspack config (innovations nl-dashboard, 88cd73a) now tells the model,
#   - the eval questions that probe it and how they're scored,
#   - the open question for eGov.
#
# Status:
#   open     no reading is stated anywhere; the eval accepts any of them only when the reply says which one
#   stated   the config states one reading; eGov hasn't confirmed it's theirs
#   settled  the readings agree on this data, or one is plainly wrong; kept as a trap or a watch item
#
# Scoring (evals/suite-run.ts): questions tagged `ambiguous` carry every definition as an accepted
# alternative plus `disclose` words. Any alternative's value + a disclose word = correct. The right value
# with no definition said = partial ("definition not said"). A short clarifying question that names the
# readings = declined_ok (a pass). Anything else = wrong.
#
# Data: synthetic, eGov's unified-dev ClickHouse, views default.su_ni_* (the ng field test, 12–18 Oct 2026).
# Values computed 2026-11-23 with read-only SQL; data fingerprint: 50,000 tasks, 2,275 coverage rows,
# 47,798 children vaccinated, 100 facilities, 1,545 vials issued, last task 2026-10-18.

data: unified-dev ClickHouse default.su_ni_* (synthetic ng field test)
computed: 2026-11-23
config: innovations nl-dashboard/lenspack 88cd73a (frozen as evals/suites/hcm/configs/views-definitions.yaml in the Lenspack repository)

entries:
  - term: children vaccinated
    status: stated
    definitions:
      - name: vaccinated children, including revisits
        sql: "SELECT sum(children_vaccinated) FROM su_ni_cov   -- = sum(is_vaccinated) FROM su_ni_task"
        value: 47798
        note: equals the distinct vaccinated individuals (uniqExactIf(individual_id, is_vaccinated = 1) = 47,798); 213 of them were vaccinated on a REVISIT visit
      - name: visits with outcome VACCINATED
        sql: "SELECT countIf(outcome = 'VACCINATED') FROM su_ni_task"
        value: 47585
        note: leaves out the 213 revisit vaccinations
    config_states: "children_vaccinated includes revisits (visits with outcome VACCINATED is smaller)"
    knock_on: "coverage vs target 93.77% vs 93.35%; wards above 95% coverage 8 vs 6; the busiest day's count"
    eval: [T1.6, T2.2, T3.1, T3.2, T4.1, T5.5, T5.7, T9.1]
    effect_of_config: "disclosure went from 0/36 to 36/36 replies once the config named the definition (post-rebase run)"
    open_question: "Which count does eGov report as 'children vaccinated': distinct children vaccinated (47,798) or VACCINATED visit outcomes (47,585)? Is a revisit vaccination a child missed the first time, or a second dose?"

  - term: vial wastage
    status: stated
    definitions:
      - name: dose-based (the pack's measure)
        sql: "1 - children_vaccinated / ((vials_issued - (vials_returned - opened_vials_returned - spoilt_vials_returned)) * 50)"
        value: 0.1487
        note: assumes 50 doses per vial
      - name: dose-based over opened vials returned
        sql: "1 - children_vaccinated / (opened_vials_returned * 50)"
        value: 0.1442
      - name: spoilt vials over vials issued
        sql: "sum(spoilt_vials_returned) / sum(vials_issued)"
        value: 0.0039
        note: 6 spoilt of 1,545 issued; the blind second author's first choice
    config_states: "vial wastage is dose-based, 1 - vaccinated / (vials used x 50), not opened or spoilt vials (spoilt_vials_pct = spoilt / issued)"
    eval: [T4.5, T9.2]
    open_question: "What is eGov's wastage formula, and is 50 doses per vial right for every product in the campaign? On this data every issued vial comes back as returned (1,545 issued, 1,545 returned), so 'vials used' depends entirely on how opened and spoilt returns are read."

  - term: zero-dose share
    status: stated
    definitions:
      - name: zero-dose over enumerated children
        sql: "SELECT sum(zero_dose_children) / sum(children_enumerated) FROM su_ni_zd_facility"
        value: 0.1182
        note: "5,701 / 48,250; Birnin Kebbi 12.17%"
      - name: zero-dose per child visit
        sql: "SELECT sum(is_zero_dose) / count() FROM su_ni_task"
        value: 0.1140
        note: "5,701 / 50,000; Birnin Kebbi 11.75%"
      - name: a place's share of all zero-dose children
        sql: "sum(zero_dose_children) by place / total zero-dose children"
        value: null
        note: "only meaningful per place; Birnin Kebbi holds 41.1% of all zero-dose children. Models picked this reading in the first full run"
    config_states: "zero_dose_pct is zero-dose over enumerated children (not per visit)"
    eval: [T5.4, T5.6, T6.1, T9.3]
    effect_of_config: "Haiku's disclosure went from 2/9 to 9/9 replies after the config named it (v2 rerun)"
    open_question: "Is eGov's zero-dose indicator per enumerated child or per visit? The two denominators differ by 1,750 (48,250 enumerated vs 50,000 visits)."

  - term: thresholds over days ("below 100 a day", "fewer than 100 on any day")
    status: open
    definitions:
      - name: on every day
        sql: "wards whose max daily vaccinations < 100"
        value: [Ambursa, Kambaza, Muntubari, Nassarawa I]
      - name: on average
        sql: "wards whose mean daily vaccinations < 100 (7 days)"
        value: [Ambursa, Kambaza, Muntubari, Nassarawa I, Zuguru]
      - name: on at least one day
        sql: "wards whose min daily vaccinations < 100"
        value: [Ambursa, Kambaza, Kukah, Muntubari, Nassarawa I, Zauro, Zuguru]
    config_states: "for thresholds like 'above 95%' say coverage of what (children vs target by default); nothing about which days"
    eval: [T6.5, T9.4]
    note: "T6.5 says 'on any single day', so it has one reading (7 wards). T9.4 says 'stayed below 100 a day', which has all three. Haiku's miss on T6.5 came from reading a cut-off ward x day series as complete, not from the definition."
    open_question: "When eGov's dashboards flag a ward as under a daily target, do they mean on any day, on average, or every day? Whichever it is should go into the config instructions."

  - term: coverage thresholds ("wards above 95%")
    status: stated
    definitions:
      - name: children vaccinated (incl. revisits) over children target
        value: 8
      - name: VACCINATED visit outcomes over children target
        value: 6
    config_states: "for thresholds like 'above 95%' say coverage of what (children vs target by default)"
    eval: [T5.5]
    open_question: "Same as children vaccinated."

  - term: field worker
    status: open
    definitions:
      - name: team login
        sql: "SELECT uniqExact(team) FROM su_ni_task"
        value: 45
        note: "ni_visits.team holds a USR- login, one per team (su_ni_teams also has 45 rows, with team_no and team_colour). The busiest login vaccinated 1,592 children (1,588 by VACCINATED outcome)"
    config_states: "lists team as a visit field; says nothing about whether a team is one person"
    eval: [E8, T9.5]
    open_question: "Is `team` one field worker's login, or a shared login for a team of two or three? Per-worker productivity questions read as real either way. Whether to show worker-level figures at all is a policy decision, not a data one."

  - term: children reached
    status: open
    definitions:
      - name: distinct children visited
        sql: "SELECT uniqExact(individual_id) FROM su_ni_task"
        value: 48251
      - name: child visits
        sql: "SELECT count() FROM su_ni_task"
        value: 50000
      - name: children vaccinated
        value: 47798
    config_states: nothing
    eval: [T9.6]
    open_question: "Which count is 'reached' in eGov's reporting? The pack has no distinct-children measure, so 48,251 is out of Lenspack's reach today."

  - term: hard to reach / insecure settlements
    status: open
    definitions:
      - name: settlement type HARD_TO_REACH
        sql: "countIf(settlement_type = 'HARD_TO_REACH')"
        value: 3333
      - name: access class 'Harder to reach'
        sql: "countIf(access_class = 'Harder to reach')"
        value: 9656
      - name: access class not Accessible (Harder to reach + Inaccessible)
        value: 12564
      - name: insecure = settlement type SECURITY_COMPROMISED
        value: 2908
        note: "the same 2,908 visits as access class Inaccessible on this data"
    config_states: "lists settlement type and access as visit fields; no definitions"
    eval: [E11, T9.8]
    open_question: "Two columns describe the same idea. Which one does eGov use for 'hard to reach', and are settlement_type and access_class meant to agree?"

  - term: best / worst place
    status: open
    definitions:
      - name: highest coverage vs target
        value: "Kalgo, 94.0%"
      - name: lowest zero-dose share
        value: "Kalgo, 10.9%"
      - name: most children vaccinated
        value: "Birnin Kebbi, 19,055"
    config_states: nothing
    eval: [T9.7]
    note: "Not a data definition but a phrasing one. A good reply names the measure, or asks."
    open_question: "Which indicator do campaign managers mean by 'doing best'? A default in the config would settle it."

  - term: average coverage
    status: stated
    definitions:
      - name: overall (sum over sum)
        value: 0.9377
      - name: plain mean of settlement percentages
        value: 0.9420
        note: "averaging also changes threshold lists: Masama (89.6%) drops out of 'wards below 90%'"
    config_states: "Superset computes every % from sums: never add or average percentages"
    eval: [T4.1, T5.1, T9.9]
    note: "Superset's saved metrics are sum over sum and Lenspack sends them by name, so only a model doing its own arithmetic falls into the mean."
    open_question: none

  - term: people in registered households
    status: settled
    definitions:
      - name: people_registered (ni_members over su_ni_member)
        value: 121720
        note: "equals dm_household_registry.member_count; the ni_status 'people' measure is a different thing"
    config_states: "member (one row per person in a registered household) gives people_registered"
    eval: [T1.7, T7.7]
    note: "Lost in the su_ni rebase and restored in 88cd73a."
    open_question: none

  - term: children per vial
    status: open
    definitions:
      - name: children vaccinated per vial issued
        sql: "47,798 / sum(vials_issued)"
        value: 30.94
      - name: children vaccinated per vial used (the pack's children_per_vial)
        sql: "47,798 / vials used (issued - returned unopened = 1,123)"
        value: 42.56
      - name: vials per child (the inverse, vials_per_child)
        value: "0.0235 vials"
    config_states: "children_per_vial and vials_per_child are inverses (both per vial used)"
    eval: [T6.3]
    note: "T6.3 asks per vial issued. Before children_per_vial existed, models reported vials_per_child or declined; with it, Haiku gives per vial used (42.6) and says so, without dividing by vials issued."
    open_question: "Which denominator does eGov use for doses or children per vial: issued or used?"

  - term: households registered, targets
    status: settled
    definitions:
      - name: households_registered (coverage) vs households (pre-rebase household dataset)
        value: "equal on this data"
      - name: target_children vs planned_target
        value: "50,975 both"
    config_states: nothing needed
    eval: [T1.1, T4.1]
    open_question: "Watch item: flag if the two sources ever diverge."

  - term: time windows
    status: stated
    definitions:
      - name: campaign days 1–7 (12–18 Oct 2026)
      - name: relative windows ("last 30 days", "this week") against today's date
        value: "empty"
    config_states: "the campaign lasted 7 days: 'last 30 days' is empty, so say so and use campaign days"
    eval: [E6, T3.x]
    open_question: none
