# One address for both apps, as the k8s ingress does: Superset at /, Lenspack at /lenspack/.
# Same origin, so Superset's session cookie, the overlay script and the iframe all just work.
# Lenspack has no login of its own here: every /lenspack/ request is let through only if
# Superset says its session cookie belongs to a signed-in user (GET /api/v1/me/).
server {
  listen 8088;
  client_max_body_size 20m;

  location /lenspack/ {
    auth_request /_superset_me;
    proxy_pass http://lenspack:8795/;          # the trailing slash strips /lenspack
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;                       # chat replies stream (server-sent events)
    proxy_read_timeout 300s;
  }

  location = /_superset_me {
    internal;
    proxy_pass http://superset:8088/api/v1/me/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
  }

  location / {
    proxy_pass http://superset:8088;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}
