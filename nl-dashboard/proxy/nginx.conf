# One address for both apps, as the k8s ingress does: Superset at /, Lenspack at /lenspack/.
# Same origin, so Superset's session cookie, the overlay script and the iframe all just work.
# Lenspack has no login of its own here: every /lenspack/ request is let through only if
# Superset says its session cookie belongs to a signed-in user (GET /api/v1/me/).
#
# Upstreams are named through variables and Docker's DNS, so a restarted container's new
# address is picked up (a plain proxy_pass resolves once, at start, and then 502s).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8088;
  client_max_body_size 20m;
  set $superset http://superset:8088;
  set $lenspack http://lenspack:8795;

  location /lenspack/ {
    auth_request /_superset_me;
    rewrite ^/lenspack/(.*)$ /$1 break;        # strip /lenspack
    proxy_pass $lenspack;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;                       # chat replies stream (server-sent events)
    proxy_read_timeout 300s;
  }

  location = /_superset_me {
    internal;
    proxy_pass $superset/api/v1/me/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
  }

  location / {
    proxy_pass $superset;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}

# The "beside" page on its own port: Lenspack's page with the chat, Superset in an iframe.
# Superset's session cookie is per host, not per port, so the same sign-in check works here.
server {
  listen 8795;
  set $superset http://superset:8088;
  set $lenspack http://lenspack:8795;

  location = /_superset_me {
    internal;
    proxy_pass $superset/api/v1/me/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }

  location /lenspack/ {
    auth_request /_superset_me;
    rewrite ^/lenspack/(.*)$ /$1 break;
    proxy_pass $lenspack;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    auth_request /_superset_me;
    error_page 401 = @signin;
    proxy_pass $lenspack;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Not signed in: Superset's login page (Superset on port 8088 of the same host).
  location @signin {
    return 302 http://$host:8088/login/;
  }
}
