# Superset: a one-off Job for the schema and users (superset/init.sh), then the web server.
apiVersion: batch/v1
kind: Job
metadata: { name: nl-dashboard-superset-init }
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: nl-dashboard-superset
          command: [/app/nl-dashboard-init.sh]
          env:
            - { name: SUPERSET_SECRET_KEY, valueFrom: { secretKeyRef: { name: nl-dashboard, key: SUPERSET_SECRET_KEY } } }
            - { name: DB_HOST, value: nl-dashboard-db }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: nl-dashboard, key: PG_PASSWORD } } }
            - { name: SUPERSET_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: nl-dashboard, key: SUPERSET_ADMIN_PASSWORD } } }
            - { name: LENSPACK_SUPERSET_PASSWORD, valueFrom: { secretKeyRef: { name: nl-dashboard, key: LENSPACK_SUPERSET_PASSWORD } } }
            - { name: LENSPACK_URL, value: /lenspack }
            - { name: TALISMAN_ENABLED, value: "true" }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata: { name: nl-dashboard-superset }
spec:
  selector: { app: nl-dashboard-superset }
  ports: [{ port: 8088, targetPort: 8088 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nl-dashboard-superset }
spec:
  replicas: 1
  selector: { matchLabels: { app: nl-dashboard-superset } }
  template:
    metadata: { labels: { app: nl-dashboard-superset } }
    spec:
      containers:
        - name: superset
          image: nl-dashboard-superset
          env:
            - { name: SUPERSET_SECRET_KEY, valueFrom: { secretKeyRef: { name: nl-dashboard, key: SUPERSET_SECRET_KEY } } }
            - { name: DB_HOST, value: nl-dashboard-db }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: nl-dashboard, key: PG_PASSWORD } } }
            - { name: LENSPACK_URL, value: /lenspack }
            - { name: TALISMAN_ENABLED, value: "true" }
            - { name: SERVER_WORKER_AMOUNT, value: "4" }
          ports: [{ containerPort: 8088 }]
          readinessProbe: { httpGet: { path: /health, port: 8088 }, periodSeconds: 10, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /health, port: 8088 }, initialDelaySeconds: 120, periodSeconds: 30 }
          resources:
            requests: { cpu: 500m, memory: 1536Mi }
            limits: { cpu: "2", memory: 4Gi }
