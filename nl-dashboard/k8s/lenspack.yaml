# The Lenspack server for Superset: chat API, the "beside" page and the overlay script, under /lenspack.
apiVersion: v1
kind: Service
metadata: { name: nl-dashboard-lenspack }
spec:
  selector: { app: nl-dashboard-lenspack }
  ports: [{ port: 8795, targetPort: 8795 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nl-dashboard-lenspack }
spec:
  replicas: 1                     # board bookkeeping is per process: keep one
  strategy: { type: Recreate }
  selector: { matchLabels: { app: nl-dashboard-lenspack } }
  template:
    metadata: { labels: { app: nl-dashboard-lenspack } }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: lenspack
          image: nl-dashboard-lenspack
          env:
            - { name: SUPERSET_URL, value: "http://nl-dashboard-superset:8088" }
            - { name: LENSPACK_SUPERSET_PASSWORD, valueFrom: { secretKeyRef: { name: nl-dashboard, key: LENSPACK_SUPERSET_PASSWORD } } }
            - { name: ANTHROPIC_API_KEY, valueFrom: { secretKeyRef: { name: nl-dashboard, key: ANTHROPIC_API_KEY } } }
          ports: [{ containerPort: 8795 }]
          # Up once Superset answers and the datasets exist (setup); it restarts until then.
          readinessProbe: { httpGet: { path: /_superset/info, port: 8795 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: nl-dashboard-lenspack }   # from ../lenspack/lenspack-superset.yaml (README)
        - name: data
          emptyDir: {}                                 # charts Lenspack made; Superset keeps the dashboards
